<div class="fila">
  {% for h in f.hidden_fields %}{{ h }}{% endfor %}
  {{ f.non_field_errors }}
  {% for c in f.visible_fields %}
  <div class="campo c-{{ c.name }}{% if c.errors %} con-error{% endif %}">
    <label for="{{ c.id_for_label }}">{{ c.label }}</label>{{ c }}
    {% for e in c.errors %}<span class="error">{{ e }}</span>{% endfor %}
  </div>
  {% endfor %}
</div>
